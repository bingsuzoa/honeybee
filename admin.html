<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 - 신혼부부 대출 계산기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .auth-section {
      margin-bottom: 20px;
    }

    .auth-form {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="password"] {
      padding: 10px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 14px;
      flex: 1;
      max-width: 300px;
    }

    button {
      padding: 10px 20px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    button:hover {
      background: #0077ed;
    }

    button:disabled {
      background: #d2d2d7;
      cursor: not-allowed;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .stat-label {
      font-size: 14px;
      color: #86868b;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 600;
      color: #0071e3;
    }

    .logs-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .log-item {
      border-bottom: 1px solid #f5f5f7;
      padding: 15px 0;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-meta {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: #86868b;
      margin-bottom: 8px;
    }

    .log-content {
      font-size: 14px;
      background: #f5f5f7;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 0;
      font-size: 12px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #86868b;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 관리자 대시보드</h1>
      <p>신혼부부 대출 계산기 사용 이력 모니터링</p>
    </header>

    <div class="auth-section">
      <div class="auth-form" id="authForm">
        <input type="password" id="tokenInput" placeholder="관리자 토큰을 입력하세요">
        <button onclick="login()">로그인</button>
      </div>
      <div id="errorMessage" class="error hidden"></div>
    </div>

    <div id="dashboard" class="hidden">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">전체 로그</div>
          <div class="stat-value" id="totalLogs">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">고유 사용자</div>
          <div class="stat-value" id="uniqueUsers">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">고유 세션</div>
          <div class="stat-value" id="uniqueSessions">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">오늘</div>
          <div class="stat-value" id="todayLogs">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">최근 7일</div>
          <div class="stat-value" id="last7DaysLogs">-</div>
        </div>
      </div>

      <div class="logs-section">
        <div class="logs-header">
          <h2>최근 사용 이력</h2>
          <button onclick="loadLogs()">새로고침</button>
        </div>
        <div id="logsList"></div>
        <div class="pagination">
          <button onclick="prevPage()" id="prevBtn">이전</button>
          <span id="pageInfo">1 페이지</span>
          <button onclick="nextPage()" id="nextBtn">다음</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = '';
    let currentPage = 0;
    const limit = 10;

    function login() {
      token = document.getElementById('tokenInput').value;
      if (!token) {
        showError('토큰을 입력해주세요.');
        return;
      }

      // 토큰 검증 및 데이터 로드
      loadStats().then(success => {
        if (success) {
          document.getElementById('authForm').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          loadLogs();
        }
      });
    }

    async function loadStats() {
      try {
        const response = await fetch('/api/usage-logs/admin/stats', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            showError('인증 실패: 토큰이 올바르지 않습니다.');
            return false;
          }
          throw new Error('Failed to load stats');
        }

        const data = await response.json();
        if (data.success) {
          document.getElementById('totalLogs').textContent = data.stats.totalLogs.toLocaleString();
          document.getElementById('uniqueUsers').textContent = data.stats.uniqueUsers.toLocaleString();
          document.getElementById('uniqueSessions').textContent = data.stats.uniqueSessions.toLocaleString();
          document.getElementById('todayLogs').textContent = data.stats.todayLogs.toLocaleString();
          document.getElementById('last7DaysLogs').textContent = data.stats.last7DaysLogs.toLocaleString();
          hideError();
          return true;
        }
        return false;
      } catch (error) {
        console.error('Error loading stats:', error);
        showError('통계를 불러오는데 실패했습니다.');
        return false;
      }
    }

    async function loadLogs() {
      const logsList = document.getElementById('logsList');
      logsList.innerHTML = '<div class="loading">로딩 중...</div>';

      try {
        const offset = currentPage * limit;
        const response = await fetch(`/api/usage-logs/admin?limit=${limit}&offset=${offset}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          throw new Error('Failed to load logs');
        }

        const data = await response.json();
        if (data.success) {
          renderLogs(data.data);
          updatePagination(data.pagination);
          loadStats(); // 통계도 함께 갱신
        }
      } catch (error) {
        console.error('Error loading logs:', error);
        logsList.innerHTML = '<div class="error">로그를 불러오는데 실패했습니다.</div>';
      }
    }

    function renderLogs(logs) {
      const logsList = document.getElementById('logsList');

      if (logs.length === 0) {
        logsList.innerHTML = '<div class="loading">아직 사용 이력이 없습니다.</div>';
        return;
      }

      logsList.innerHTML = logs.map(log => {
        const input = log.input_data.selections || log.input_data;
        const result = log.analysis_result;

        return `
          <div class="log-item">
            <div class="log-meta">
              <span>🆔 ${log.id}</span>
              <span>👤 ${log.anonymous_user_id.substring(0, 20)}...</span>
              <span>📅 ${new Date(log.created_at).toLocaleString('ko-KR')}</span>
            </div>
            <div class="log-content">
              <div style="margin-bottom: 10px;">
                <strong style="color: #0071e3; font-size: 16px;">
                  추천 결과: ${result.recommendedProductName || '없음'}
                </strong>
              </div>
              <details open>
                <summary style="cursor: pointer; font-weight: 500; margin-bottom: 10px;">
                  📝 사용자 입력 조건
                </summary>
                <div style="background: white; padding: 10px; border-radius: 4px; margin-bottom: 10px;">
                  ${formatInputData(input)}
                </div>
              </details>
              <details>
                <summary style="cursor: pointer; font-weight: 500; margin-bottom: 10px;">
                  📊 분석 결과 상세
                </summary>
                <pre>${JSON.stringify(result, null, 2)}</pre>
              </details>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatInputData(input) {
      const labels = {
        maritalStatus: '혼인 상태',
        marriagePeriod: '혼인 기간',
        hasNewborn: '2년 이내 출생아',
        housingStatus: '주택 보유',
        householdNoHouseConfirmed: '세대원 전원 무주택',
        firstHomeBuyer: '생애최초',
        childrenCount: '자녀 수',
        combinedIncome: '부부합산 연소득',
        netAsset: '순자산',
        housePrice: '주택가격',
        region: '지역',
        exclusiveArea: '전용면적',
        privateSale: '민간분양',
        requestedLoanAmount: '대출금액',
        loanTermYears: '대출기간',
        purchasePurpose: '대출목적',
        householdLoanStatus: '기존 기금대출',
        contractAndMoveInStatus: '계약/입주 상태',
        houseLegalStatus: '주택 법적 상태',
        creditStatus: '신용 상태',
        acquisitionType: '주택 구입 방법',
        hasHousingSubscription: '청약저축',
        subscriptionYears: '청약통장 가입기간',
        subscriptionPaymentCount: '청약통장 납입횟수',
        usesElectronicContract: '전자계약',
        contractDate: '매매계약일'
      };

      const valueLabels = {
        married: '기혼',
        under7: '7년 이하',
        over7: '7년 초과',
        yes: '예',
        no: '아니오',
        none: '무주택',
        owned: '보유',
        unknown: '확인 필요',
        under85: '8천5백만원 이하',
        '85to100': '8천5백만원~1억원',
        '100to130': '1억원~1.3억원',
        '130to200_dual': '1.3억원~2억원(맞벌이)',
        over130: '1.3억원 초과',
        over200: '2억원 초과',
        under511: '5.11억원 이하',
        over511: '5.11억원 초과',
        under600: '6억원 이하',
        '600to900': '6억원~9억원',
        over900: '9억원 초과',
        capital: '수도권',
        local: '지방',
        under320: '3.2억원 이하',
        '320to360': '3.2억원~3.6억원',
        '360to400': '3.6억원~4억원',
        over400: '4억원 초과',
        PRIVATE_PRESALE_WINNER: '민간분양 청약 당첨',
        PUBLIC_PRESALE_WINNER: '공공분양 청약 당첨',
        GENERAL_PURCHASE: '일반 매매',
        purchase_live: '실거주 구입',
        refinance: '대환',
        investment_or_rent: '투자/임대',
        no_existing_fund_loan: '없음',
        has_existing_fund_loan: '있음',
        contract_signed_move_in: '계약완료, 입주예정',
        before_contract: '계약 전',
        no_move_in: '입주 안함',
        eligible_residential: '담보설정 가능',
        unclear_house_type: '주택유형 불명확',
        collateral_issue: '담보설정 이슈',
        no_issue: '문제 없음',
        has_delinquency: '연체 이력',
        debt_adjustment: '개인회생/파산',
        under5: '5년 미만',
        '5to10': '5년~10년',
        '10to15': '10년~15년',
        over15: '15년 이상',
        under60: '60회 미만',
        '60to120': '60회~120회',
        '120to180': '120회~180회',
        over180: '180회 이상',
        before2025_06_27: '2025.6.27 이전',
        on_or_after2025_06_27: '2025.6.27 이후',
        '10': '10년',
        '15': '15년',
        '20': '20년',
        '30': '30년',
        '40': '40년'
      };

      return Object.entries(input)
        .filter(([key]) => labels[key])
        .map(([key, value]) => {
          const label = labels[key];
          let displayValue = valueLabels[value] || value;

          // 전용면적 특수 처리
          if (key === 'exclusiveArea') {
            if (value === 'under85') displayValue = '85m2 이하';
            else if (value === 'over85') displayValue = '85m2 초과';
          }

          return `<div style="padding: 4px 0; border-bottom: 1px solid #f5f5f7;">
            <span style="color: #86868b; font-size: 12px;">${label}:</span>
            <strong style="margin-left: 10px;">${displayValue}</strong>
          </div>`;
        })
        .join('');
    }

    function updatePagination(pagination) {
      const { total, limit, offset } = pagination;
      const totalPages = Math.ceil(total / limit);
      const currentPageNum = Math.floor(offset / limit) + 1;

      document.getElementById('pageInfo').textContent = `${currentPageNum} / ${totalPages} 페이지`;
      document.getElementById('prevBtn').disabled = currentPage === 0;
      document.getElementById('nextBtn').disabled = currentPageNum >= totalPages;
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        loadLogs();
      }
    }

    function nextPage() {
      currentPage++;
      loadLogs();
    }

    function showError(message) {
      const errorElement = document.getElementById('errorMessage');
      errorElement.textContent = message;
      errorElement.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorMessage').classList.add('hidden');
    }

    // Enter 키로 로그인
    document.getElementById('tokenInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        login();
      }
    });
  </script>
</body>
</html>
